name: milklink_mobile
description: "Pasig City Human Milk Bank Mobile Application for Donors and Mothers"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
   sdk: flutter
  milklink_shared:
    path: ../shared
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.3
  fl_chart: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/MilkLink_Mobile_Logo.png"

flutter:
  uses-material-design: true
